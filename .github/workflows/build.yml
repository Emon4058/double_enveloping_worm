name: Build executables

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - run: pip install pyinstaller
      - run: python build_app.py
      - name: Name the executable after the OS
        shell: bash
        run: |
          cd dist
          case "${{ runner.os }}" in
            Windows) mv WormGearDesigner.exe WormGearDesigner-Windows.exe ;;
            macOS)   mv WormGearDesigner WormGearDesigner-macOS ;;
            Linux)   mv WormGearDesigner WormGearDesigner-Linux ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: WormGearDesigner-${{ runner.os }}
          path: dist/*

  release:
    # Pushing a tag such as v1.0 publishes the executables as a GitHub release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
