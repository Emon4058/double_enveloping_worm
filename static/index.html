<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Globoidal Worm Gear Designer</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6677;
    --border: #d9dde5; --accent: #2457c5; --accent-text: #ffffff;
    --warn-bg: #fff6e0; --warn-border: #e2b33c; --err-bg: #fdecec; --err-border: #d64545;
    --ok: #1d7a3a; --bad: #b42318; --row-alt: #f3f5f9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171d; --panel: #1c2028; --text: #e6e9ef; --muted: #9aa3b2;
      --border: #333a47; --accent: #6f9bff; --accent-text: #0d1117;
      --warn-bg: #3a2f12; --warn-border: #b8902c; --err-bg: #3d1a1a; --err-border: #c24b4b;
      --ok: #5fcf83; --bad: #ff8a80; --row-alt: #222733;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 20px 16px 8px; max-width: 1200px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 1.5rem; }
  header p { margin: 0; color: var(--muted); }
  main { display: grid; grid-template-columns: 340px 1fr; gap: 20px;
         max-width: 1200px; margin: 0 auto; padding: 16px; align-items: start; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  main > * { min-width: 0; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  form h2, .results h2 { font-size: 1.05rem; margin: 0 0 12px; }
  label { display: block; font-size: .85rem; color: var(--muted); margin: 10px 0 3px; }
  label b { color: var(--text); font-weight: 600; }
  input, select { width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px;
                  background: var(--bg); color: var(--text); font: inherit; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  details { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 10px; }
  summary { cursor: pointer; font-weight: 600; }
  .hint { font-size: .8rem; color: var(--muted); margin-top: 3px; }
  .hint button { font-size: .8rem; padding: 0; border: 0; background: none; color: var(--accent);
                 cursor: pointer; text-decoration: underline; }
  .buttons { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  button.primary, button.secondary { padding: 9px 14px; border-radius: 6px; font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border: 1px solid var(--accent); font-weight: 600; }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .msg { border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; }
  .msg ul { margin: 4px 0 0; padding-left: 20px; }
  .msg.warn { background: var(--warn-bg); border: 1px solid var(--warn-border); }
  .msg.err { background: var(--err-bg); border: 1px solid var(--err-border); }
  .section { margin-bottom: 20px; }
  .section h3 { font-size: 1rem; margin: 0 0 6px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: .8rem; }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  td.val { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
  td.sym { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82rem; white-space: nowrap; }
  td.ref, td.note { color: var(--muted); font-size: .82rem; }
  .ok { color: var(--ok); font-weight: 600; }
  .bad { color: var(--bad); font-weight: 600; }
  .empty { color: var(--muted); }
  @media print {
    form, .buttons, header p { display: none; }
    main { grid-template-columns: 1fr; }
    .panel { border: 0; }
  }
</style>
</head>
<body>
<header>
  <h1>Double-Enveloping Worm Gearset Designer</h1>
  <p>Globoidal (Hindley) wormgearing per ANSI/AGMA 6135-A02, metric edition</p>
</header>
<main>
  <form id="form" class="panel" autocomplete="off">
    <h2>Design inputs</h2>
    <label for="z2"><b>Number of teeth of worm wheel</b>, z<sub>2</sub></label>
    <input id="z2" name="z2" type="number" min="1" step="1" value="30" required>
    <label for="z1"><b>Number of starts of worm</b>, z<sub>1</sub></label>
    <input id="z1" name="z1" type="number" min="1" step="1" value="1" required>
    <div class="hint" id="ratioHint"></div>
    <label for="a"><b>Center distance</b>, a [mm]</label>
    <input id="a" name="a" type="number" min="0" step="any" value="101.6" required>
    <label for="alpha_n"><b>Normal pressure angle</b>, α<sub>n</sub> [deg]</label>
    <input id="alpha_n" name="alpha_n" type="number" min="0" max="45" step="any" value="20" required>
    <div class="hint">Generally 20 – 25°</div>
    <label for="m_a"><b>Axial module</b>, m<sub>a</sub> [mm]</label>
    <input id="m_a" name="m_a" type="number" min="0" step="any" value="5.48" required>
    <div class="hint" id="moduleHint"></div>

    <details>
      <summary>Rating &amp; strength (optional)</summary>
      <label for="n1">Worm speed, n<sub>1</sub> [rpm]</label>
      <input id="n1" name="n1" type="number" min="0" step="any" value="1750">
      <label for="backlash">Backlash on gear pitch circle, j<sub>x</sub> [mm]</label>
      <input id="backlash" name="backlash" type="number" min="0" step="any" value="0">
      <label for="efficiency">Efficiency [%]</label>
      <input id="efficiency" name="efficiency" type="number" min="0" max="100" step="any" placeholder="estimate from Annex F">
      <label for="input_power">Applied input power [kW]</label>
      <input id="input_power" name="input_power" type="number" min="0" step="any" placeholder="use rated power">
      <label for="hours_per_day">Operation [hours/day]</label>
      <input id="hours_per_day" name="hours_per_day" type="number" min="0" max="24" step="any" value="10">
      <label for="load_type">Load type</label>
      <select id="load_type" name="load_type">
        <option value="uniform">Uniform</option>
        <option value="moderate">Moderate shock</option>
        <option value="heavy">Heavy shock</option>
        <option value="extreme">Extreme shock</option>
      </select>
      <label for="service_factor">Service factor override</label>
      <input id="service_factor" name="service_factor" type="number" min="0" step="any" placeholder="from table D.1">
      <label for="bearing_la">Worm bearing distance L<sub>A</sub> [mm]</label>
      <input id="bearing_la" name="bearing_la" type="number" min="0" step="any" placeholder="pitch point to bearing A">
      <label for="bearing_lb">Worm bearing distance L<sub>B</sub> [mm]</label>
      <input id="bearing_lb" name="bearing_lb" type="number" min="0" step="any" placeholder="pitch point to bearing B">
      <label for="worm_uts">Worm core tensile strength [N/mm²]</label>
      <input id="worm_uts" name="worm_uts" type="number" min="0" step="any">
      <label for="worm_yield">Worm core yield strength [N/mm²]</label>
      <input id="worm_yield" name="worm_yield" type="number" min="0" step="any">
      <label for="youngs_modulus">Worm modulus of elasticity [N/mm²]</label>
      <input id="youngs_modulus" name="youngs_modulus" type="number" min="0" step="any" value="206850">
    </details>

    <div class="buttons">
      <button class="primary" type="submit">Calculate</button>
      <button class="secondary" type="button" id="csv" disabled>Export CSV</button>
      <button class="secondary" type="button" onclick="window.print()">Print</button>
    </div>
  </form>

  <section class="panel results" id="results">
    <h2>Gearset parameters</h2>
    <p class="empty">Enter the design inputs and press <b>Calculate</b>.</p>
  </section>
</main>

<script>
const form = document.getElementById('form');
const results = document.getElementById('results');
const csvBtn = document.getElementById('csv');
let lastResult = null;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const val = id => parseFloat(document.getElementById(id).value);

function updateHints() {
  const z2 = val('z2'), z1 = val('z1'), a = val('a');
  const rh = document.getElementById('ratioHint');
  rh.innerHTML = z2 > 0 && z1 > 0
    ? `Gear ratio u = z<sub>2</sub>/z<sub>1</sub> = <b>${+(z2 / z1).toFixed(4)}</b>`
    : '';
  const mh = document.getElementById('moduleHint');
  if (a > 0 && z2 > 0) {
    const ma = (2 * a - Math.pow(a, 0.875) / 1.47) / z2;
    mh.innerHTML = `Eq. 2 suggests m<sub>a</sub> ≈ ${ma.toFixed(4)} mm <button type="button" data-ma="${ma.toFixed(4)}">use</button>`;
  } else mh.textContent = '';
}
form.addEventListener('input', updateHints);
form.addEventListener('click', e => {
  const b = e.target.closest('button[data-ma]');
  if (!b) return;
  document.getElementById('m_a').value = b.dataset.ma;
  updateHints();
});
updateHints();

function fmt(v) {
  if (typeof v !== 'number') return esc(v);
  if (Number.isInteger(v)) return String(v);
  const a = Math.abs(v);
  return a >= 1000 ? v.toFixed(1) : a >= 1 ? v.toFixed(3) : v.toFixed(4);
}

function noteHtml(n) {
  if (n === 'OK') return '<span class="ok">OK</span>';
  if (n === 'NOT MET' || n === 'EXCEEDED') return `<span class="bad">${n}</span>`;
  return esc(n);
}

function render(data) {
  let html = '<h2>Gearset parameters</h2>';
  if (data.errors) {
    html += `<div class="msg err"><b>Cannot calculate</b><ul>${data.errors.map(e => `<li>${esc(e)}</li>`).join('')}</ul></div>`;
    results.innerHTML = html;
    return;
  }
  if (data.warnings.length) {
    html += `<div class="msg warn"><b>Design checks</b><ul>${data.warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>`;
  }
  for (const s of data.sections) {
    html += `<div class="section"><h3>${esc(s.title)}</h3><div class="table-wrap"><table>
      <thead><tr><th>Symbol</th><th>Parameter</th><th style="text-align:right">Value</th><th>Unit</th><th>Ref.</th><th>Note</th></tr></thead><tbody>`;
    for (const r of s.rows) {
      html += `<tr><td class="sym">${esc(r.symbol)}</td><td>${esc(r.name)}</td><td class="val">${fmt(r.value)}</td>
        <td>${esc(r.unit)}</td><td class="ref">${esc(r.ref)}</td><td class="note">${noteHtml(r.note)}</td></tr>`;
    }
    html += '</tbody></table></div></div>';
  }
  results.innerHTML = html;
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const payload = {};
  for (const [k, v] of new FormData(form).entries()) payload[k] = v;
  try {
    const res = await fetch('/api/calculate', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
    });
    const data = await res.json();
    lastResult = data.errors ? null : data;
    csvBtn.disabled = !lastResult;
    render(data);
  } catch (err) {
    render({errors: ['Could not reach the calculation server: ' + err.message]});
  }
});

csvBtn.addEventListener('click', () => {
  if (!lastResult) return;
  const q = s => `"${String(s).replace(/"/g, '""')}"`;
  const lines = [['Section', 'Symbol', 'Parameter', 'Value', 'Unit', 'Reference', 'Note'].map(q).join(',')];
  for (const s of lastResult.sections)
    for (const r of s.rows)
      lines.push([s.title, r.symbol, r.name, r.value, r.unit, r.ref, r.note].map(q).join(','));
  lastResult.warnings.forEach(w => lines.push([q('Warning'), '', q(w)].join(',')));
  const blob = new Blob([lines.join('\n')], {type: 'text/csv'});
  const link = Object.assign(document.createElement('a'),
    {href: URL.createObjectURL(blob), download: 'globoidal_worm_gearset.csv'});
  link.click();
  URL.revokeObjectURL(link.href);
});
</script>
</body>
</html>
